name: Deploy

on: workflow_dispatch

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Checks
        working-directory: backend
        run: |
          pip install -r requirements.txt ruff==0.15.22
          ruff check .
          pytest

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        run: ./deploy.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COCKROACH_MCP_URL: ${{ vars.COCKROACH_MCP_URL }}
          COCKROACH_MCP_API_KEY: ${{ secrets.COCKROACH_MCP_API_KEY }}
          COCKROACH_MCP_CLUSTER_ID: ${{ vars.COCKROACH_MCP_CLUSTER_ID }}
          BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
          BEDROCK_EMBEDDING_MODEL_ID: ${{ vars.BEDROCK_EMBEDDING_MODEL_ID }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_EMBEDDING_MODEL: ${{ vars.GEMINI_EMBEDDING_MODEL }}
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}

      - name: Why the stack failed
        if: failure()
        run: |
          ID=$(aws cloudformation list-stacks \
            --query "reverse(sort_by(StackSummaries[?StackName=='recall'], &CreationTime))[0].StackId" \
            --output text)
          [ "$ID" = "None" ] && exit 0
          aws cloudformation describe-stack-events --stack-name "$ID" \
            --query "StackEvents[?contains(ResourceStatus,'FAILED')].[LogicalResourceId,ResourceStatusReason]" \
            --output text
